name: Build 710 for macOS

on:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-15

    steps:
      - name: Get game files and SDL3
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure the Mac build
        run: cmake -S . -B build-mac -DCMAKE_BUILD_TYPE=Release

      - name: Compile 710
        run: cmake --build build-mac --parallel 3

      - name: Check the Mac application
        run: |
          test -f build-mac/710.app/Contents/MacOS/710
          test -d build-mac/710.app/Contents/Resources/assets/levels

      - name: Zip the Mac application
        run: ditto -c -k --sequesterRsrc --keepParent build-mac/710.app 710-macOS.zip

      - name: Make the build downloadable
        uses: actions/upload-artifact@v4
        with:
          name: 710-macOS
          path: 710-macOS.zip
          if-no-files-found: error
